<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F8F5EE" />
  <title>EV CAFE | تسجيل الدخول</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/login.css?v=20261002_ev1" />
</head>
<body class="login-body">

  <main class="login-viewport">
    <div id="session-check-loader" class="session-check-loader" aria-live="polite">
      <div class="card-brand" dir="ltr" aria-label="EV CAFE">
        <img src="/assets/ev-cafe-icon-trans.png" alt="EV CAFE" class="brand-logo-emblem" width="44" height="44" />
        <span class="brand-text-group">
          <span class="logo-word-ev">EV</span>
          <span class="logo-word-cafe">CAFE</span>
        </span>
      </div>
      <div class="spinner-ring" aria-hidden="true"></div>
    </div>

    <div class="login-card" id="login-card" hidden>

      <!-- شعار EV CAFE الرسمي -->
      <div class="card-brand" dir="ltr" aria-label="EV CAFE">
        <img src="/assets/ev-cafe-icon-trans.png" alt="EV CAFE" class="brand-logo-emblem" width="44" height="44" />
        <span class="brand-text-group">
          <span class="logo-word-ev">EV</span>
          <span class="logo-word-cafe">CAFE</span>
        </span>
      </div>

      <!-- تنبيه الأخطاء أو الإشعارات -->
      <div id="auth-alert" class="auth-alert" role="alert" aria-live="assertive" hidden>
        <span class="auth-alert-icon" id="auth-alert-icon" aria-hidden="true">!</span>
        <div class="auth-alert-content">
          <p id="auth-alert-message"></p>
        </div>
      </div>

      <!-- 1) كارد تسجيل الدخول الأساسي (مفتوح وجاهز فوراً) -->
      <div id="signin-view" class="auth-view">
        <h1 class="card-title">تسجيل الدخول</h1>

        <form id="login-form" class="auth-form" novalidate>
          <div class="field-group" id="email-field-group">
            <label for="email" class="field-label">البريد الإلكتروني</label>
            <div class="input-shell">
              <input
                id="email"
                name="email"
                type="email"
                class="field-input"
                dir="ltr"
                autocomplete="username"
                inputmode="email"
                enterkeyhint="next"
                placeholder="name@example.com"
                aria-describedby="email-error"
                required
              />
            </div>
            <p id="email-error" class="field-error" role="alert" hidden></p>
          </div>

          <div class="field-group" id="password-field-group">
            <label for="current-password" class="field-label">كلمة المرور</label>
            <div class="input-shell has-action">
              <input
                id="current-password"
                name="password"
                type="password"
                class="field-input"
                dir="ltr"
                autocomplete="current-password"
                enterkeyhint="done"
                placeholder="••••••••"
                aria-describedby="password-error"
                required
              />
              <button
                type="button"
                id="toggle-password-btn"
                class="password-toggle-btn"
                aria-label="إظهار كلمة المرور"
                aria-pressed="false"
                aria-controls="current-password"
              >
                <svg class="icon-eye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
            <p id="password-error" class="field-error" role="alert" hidden></p>
          </div>

          <button type="submit" id="login-submit-btn" class="primary-submit-btn">
            <span class="btn-spinner" id="login-btn-spinner" aria-hidden="true" hidden></span>
            <svg class="btn-icon" id="login-btn-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            <span id="login-submit-label">تسجيل الدخول</span>
          </button>
          <button type="button" id="open-reset-btn" class="inline-link-btn">نسيت كلمة المرور؟</button>
        </form>
      </div>

      <!-- 2) كارد استعادة كلمة المرور -->
      <div id="reset-view" class="auth-view" hidden>
        <h2 class="card-title">استعادة كلمة المرور</h2>

        <form id="reset-form" class="auth-form" novalidate>
          <div class="field-group" id="reset-email-group">
            <label for="reset-email" class="field-label">البريد الإلكتروني</label>
            <div class="input-shell">
              <input
                id="reset-email"
                name="reset_email"
                type="email"
                class="field-input"
                dir="ltr"
                autocomplete="email"
                inputmode="email"
                placeholder="name@example.com"
                aria-describedby="reset-email-error"
                required
              />
            </div>
            <p id="reset-email-error" class="field-error" role="alert" hidden></p>
          </div>

          <button type="submit" id="reset-submit-btn" class="primary-submit-btn">
            <span class="btn-spinner" id="reset-btn-spinner" aria-hidden="true" hidden></span>
            <svg class="btn-icon" id="reset-btn-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
            <span id="reset-submit-label">إرسال رابط الاستعادة</span>
          </button>
          <button type="button" id="back-to-signin-btn" class="secondary-ghost-btn">العودة إلى تسجيل الدخول</button>
        </form>
      </div>

      <!-- 3) كارد تعيين كلمة المرور الجديدة -->
      <div id="recovery-view" class="auth-view" hidden>
        <h2 class="card-title">تعيين كلمة مرور جديدة</h2>

        <form id="recovery-form" class="auth-form" novalidate>
          <div class="field-group" id="new-password-group">
            <label for="new-password" class="field-label">كلمة المرور الجديدة</label>
            <div class="input-shell has-action">
              <input
                id="new-password"
                name="new_password"
                type="password"
                class="field-input"
                dir="ltr"
                autocomplete="new-password"
                enterkeyhint="done"
                minlength="8"
                placeholder="8 أحرف على الأقل"
                aria-describedby="new-password-error"
                required
              />
              <button
                type="button"
                id="toggle-new-password-btn"
                class="password-toggle-btn"
                aria-label="إظهار كلمة المرور الجديدة"
                aria-pressed="false"
                aria-controls="new-password"
              >
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                  <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                  <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                  <line x1="2" y1="2" x2="22" y2="22" />
                </svg>
              </button>
            </div>
            <p id="new-password-error" class="field-error" role="alert" hidden></p>
          </div>

          <button type="submit" id="recovery-submit-btn" class="primary-submit-btn">
            <span class="btn-spinner" id="recovery-btn-spinner" aria-hidden="true" hidden></span>
            <svg class="btn-icon" id="recovery-btn-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
            <span id="recovery-submit-label">حفظ والدخول</span>
          </button>
        </form>
      </div>

    </div>
  </main>

  <script src="/vendor/supabase.umd.js"></script>
  <script type="module" src="/js/login-app.js?v=20260930_login_v2"></script>
</body>
</html>
