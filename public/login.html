<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07050C" />
  <meta name="description" content="تسجيل دخول موظفي وإدارة BOX COFE." />
  <meta property="og:site_name" content="BOX COFE" />
  <meta property="og:type" content="website" />
    <meta property="og:image" content="https://box-cofe-web.vercel.app/og-image.png?v=2" />
    <meta property="og:image:secure_url" content="https://box-cofe-web.vercel.app/og-image.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="شعار BOX COFE" />
  <meta property="og:title" content="BOX COFE | تسجيل الدخول" />
  <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://box-cofe-web.vercel.app/og-image.png?v=2" />
  <title>BOX COFE | تسجيل الدخول</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Montserrat:wght@800;900&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/login.css" />
</head>
<body class="login-body">

  <main class="login-viewport">
    <div class="login-card">

      <!-- شعار بوكس كافي الرسمي -->
      <div class="card-brand" dir="ltr" aria-label="BOX COFE">
        <span class="logo-box">BOX</span>
        <span class="logo-cofe">COFE</span>
      </div>

      <!-- تنبيه الأخطاء أو الإشعارات -->
      <div id="auth-alert" class="auth-alert" role="alert" aria-live="assertive" hidden>
        <span class="auth-alert-icon" id="auth-alert-icon" aria-hidden="true">!</span>
        <div class="auth-alert-content">
          <p id="auth-alert-message"></p>
        </div>
      </div>

      <!-- 1) كارد تسجيل الدخول الأساسي (مفتوح وجاهز فوراً) -->
      <div id="signin-view" class="auth-view">
        <h1 class="card-title">تسجيل الدخول</h1>

        <form id="login-form" class="auth-form" novalidate>
          <div class="field-group" id="email-field-group">
            <label for="email" class="field-label">البريد الإلكتروني</label>
            <div class="input-shell">
              <input
                id="email"
                name="email"
                type="email"
                class="field-input"
                dir="ltr"
                autocomplete="username"
                inputmode="email"
                enterkeyhint="next"
                placeholder="name@example.com"
                aria-describedby="email-error"
                required
              />
            </div>
            <p id="email-error" class="field-error" role="alert" hidden></p>
          </div>

          <div class="field-group" id="password-field-group">
            <label for="current-password" class="field-label">كلمة المرور</label>
            <div class="input-shell has-action">
              <input
                id="current-password"
                name="password"
                type="password"
                class="field-input"
                dir="ltr"
                autocomplete="current-password"
                enterkeyhint="done"
                placeholder="••••••••"
                aria-describedby="password-error"
                required
              />
              <button
                type="button"
                id="toggle-password-btn"
                class="password-toggle-btn"
                aria-label="إظهار كلمة المرور"
                aria-pressed="false"
                aria-controls="current-password"
              >
                <svg class="icon-eye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
            <p id="password-error" class="field-error" role="alert" hidden></p>
          </div>

          <button type="submit" id="login-submit-btn" class="primary-submit-btn">
            <span class="btn-spinner" id="login-btn-spinner" aria-hidden="true" hidden></span>
            <span id="login-submit-label">تسجيل الدخول</span>
          </button>
        </form>
      </div>

      <!-- 3) كارد تعيين كلمة المرور الجديدة -->
      <div id="recovery-view" class="auth-view" hidden>
        <h2 class="card-title">تعيين كلمة مرور جديدة</h2>

        <form id="recovery-form" class="auth-form" novalidate>
          <div class="field-group" id="new-password-group">
            <label for="new-password" class="field-label">كلمة المرور الجديدة</label>
            <div class="input-shell has-action">
              <input
                id="new-password"
                name="new_password"
                type="password"
                class="field-input"
                dir="ltr"
                autocomplete="new-password"
                enterkeyhint="done"
                minlength="8"
                placeholder="8 أحرف على الأقل"
                aria-describedby="new-password-error"
                required
              />
              <button
                type="button"
                id="toggle-new-password-btn"
                class="password-toggle-btn"
                aria-label="إظهار كلمة المرور الجديدة"
                aria-pressed="false"
                aria-controls="new-password"
              >
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                  <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                  <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                  <line x1="2" y1="2" x2="22" y2="22" />
                </svg>
              </button>
            </div>
            <p id="new-password-error" class="field-error" role="alert" hidden></p>
          </div>

          <button type="submit" id="recovery-submit-btn" class="primary-submit-btn">
            <span class="btn-spinner" id="recovery-btn-spinner" aria-hidden="true" hidden></span>
            <span id="recovery-submit-label">حفظ والدخول</span>
          </button>
        </form>
      </div>

    </div>
  </main>

  <script src="/vendor/supabase.umd.js"></script>
  <script type="module" src="/js/login-app.js?v=20260926_v64"></script>
</body>
</html>
