<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F5EE" />
    <title>EV CAFE — قائمة المنيو</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://rtzzoyaxivujzvghudgz.supabase.co" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles/menu.css?v=20261002_ev1" />
  </head>
  <body class="customer-menu-body">
    <!-- Luxury Brand Hero Stage & Crown Identity -->
    <header class="menu-brand-header">
      <div class="brand-hero-inner">
        <!-- Floating Luxury Medallion Badge -->
        <div class="brand-medallion-wrap">
          <div class="brand-medallion-glow" aria-hidden="true"></div>
          <a href="/" class="brand-medallion-card" aria-label="EV CAFE">
            <img src="/assets/ev-cafe-cup-emblem.png" alt="EV CAFE" class="brand-medallion-img" width="96" height="96" />
          </a>
        </div>

        <!-- Brand Name, Prestige & Soul -->
        <div class="brand-hero-content">
          <div class="brand-hero-title-group">
            <h1 class="brand-hero-title" dir="ltr">
              <span class="hero-word-ev">EV</span>
              <span class="hero-word-cafe">CAFE</span>
            </h1>
            <span class="brand-hero-specialty-pill">قهوة مختصة</span>
          </div>
          <p class="brand-hero-tagline">تجربة راقية لكل فنجان • مشروبات مختصة ومخبوزات طازجة يومياً</p>
          <div class="brand-hero-meta-row">
            <span class="hero-meta-badge status-open"><span class="hero-pulse-dot"></span> خدمة سريعة ومباشرة</span>
            <span class="hero-meta-badge"><svg class="icon icon-xs" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M16 10H9.5a2.5 2.5 0 0 0 0 5H15"/></svg> الأسعار بالدينار العراقي (IQD)</span>
          </div>
        </div>
      </div>
    </header>

    <main class="customer-main-view">
      <!-- Search & Category Filters -->
      <section class="search-filter-section" id="search-filter-section" aria-label="البحث وفئات المنيو">
        <div class="search-box-wrapper">
          <label for="search-input" class="sr-only">البحث في قائمة الطعام</label>
          <span class="search-icon-pos" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </span>
          <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="ابحث عن مشروب، صنف، أو نكهة..."
            aria-label="البحث في قائمة الطعام"
            autocomplete="off"
          />
          <button type="button" id="search-clear-btn" class="search-clear-btn" style="display: none;" aria-label="مسح البحث">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <nav class="categories-nav" id="categories-nav-section" aria-label="فئات الأصناف">
          <ul class="categories-list" id="categories-list">
            <!-- Dynamically populated categories pills -->
          </ul>
        </nav>
      </section>

      <!-- Skeleton Loading State -->
      <div class="skeleton-loading-container" id="skeleton-loading-container">
        <div class="skeleton-box skeleton-bar"></div>
        <div class="skeleton-cards-grid">
          <div class="skeleton-box skeleton-card"></div>
          <div class="skeleton-box skeleton-card"></div>
          <div class="skeleton-box skeleton-card"></div>
          <div class="skeleton-box skeleton-card"></div>
        </div>
      </div>

      <!-- Main Read-Only Catalog Layout -->
      <div class="main-content-layout customer-catalog-layout" id="main-ordering-layout">
        <div class="products-section-container" id="products-container">
          <!-- Dynamically populated product cards grouped by category -->
        </div>
      </div>

      <!-- Error / Offline Screen -->
      <section class="error-screen-view" id="error-screen-view" role="alert" style="display: none;">
        <div class="error-icon-circle" aria-hidden="true">
          <svg class="icon icon-lg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <h2 id="error-screen-title">تعذر فتح المنيو</h2>
        <p id="error-screen-message">يرجى التأكد من الاتصال بالإنترنت أو إعادة المحاولة.</p>
        <button type="button" class="retry-action-btn" id="retry-load-menu-btn">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          <span>إعادة المحاولة</span>
        </button>
      </section>
    </main>

    <!-- Product Details Dialog (Pure Read-Only Modal) -->
    <dialog id="product-modal" class="customization-modal read-only-modal" aria-labelledby="modal-product-title">
      <div class="modal-content-shell">
        <div class="modal-top-bar">
          <button type="button" class="modal-close-btn" id="modal-close-btn" aria-label="إغلاق خيارات الصنف">
            <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <div class="modal-hero-header">
          <div class="modal-thumb-box" id="modal-product-banner" style="display: none;">
            <img id="modal-product-image" src="" alt="" loading="lazy" />
          </div>
          <div class="modal-title-group">
            <h3 id="modal-product-title" class="modal-product-name">اسم الصنف</h3>
            <p id="modal-product-desc" class="modal-product-desc">وصف الصنف المختصر</p>
            <div class="modal-price-pill" id="modal-base-price-chip">0 د.ع</div>
          </div>
        </div>

        <div class="modal-scrollable-body" id="modal-options-container">
          <!-- Dynamic read-only sizes, milks, and options -->
        </div>

        <div class="modal-footer read-only-footer">
          <button type="button" class="modal-dismiss-btn" id="modal-dismiss-btn">
            <span>إغلاق</span>
          </button>
        </div>
      </div>
    </dialog>

    <footer class="customer-menu-footer">
      <div class="footer-inner">
        <span class="footer-brand" dir="ltr">EV CAFE</span>
        <span class="footer-tagline">Specialty Coffee & Bakery · تجربة قهوة متقنة</span>
      </div>
    </footer>

    <!-- Scripts -->
    <script src="/vendor/supabase.umd.js"></script>
    <script type="module" src="/js/menu-app.js?v=20260930_v6"></script>
  </body>
</html>
