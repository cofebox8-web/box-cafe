<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F5EE" />
    <title>BOX COFE — نقطة بيع الويتر</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles/waiter.css?v=20260927_waiter_v2" />
  </head>
  <body class="waiter-body">
    <!-- Login Gate (Shows only when not authenticated) -->
    <section class="waiter-login-gate" id="waiter-login-gate" role="dialog" aria-modal="true" aria-labelledby="waiter-login-title">
      <form class="waiter-login-card" id="waiter-login-form">
        <a href="/" class="brand-signature-lockup" aria-label="BOX COFE" dir="ltr">
          <span class="logo-word-box">BOX</span>
          <span class="logo-word-cofe">COFE</span>
        </a>
        <h1 id="waiter-login-title">تسجيل دخول الويتر</h1>
        <div class="login-form-group">
          <label for="waiter-email">البريد الإلكتروني</label>
          <input id="waiter-email" name="email" type="email" autocomplete="username" inputmode="email" dir="ltr" required placeholder="name@boxcofe.iq" />
        </div>
        <div class="login-form-group">
          <label for="waiter-password">كلمة المرور</label>
          <input id="waiter-password" name="password" type="password" autocomplete="current-password" dir="ltr" required placeholder="••••••••" />
        </div>
        <p class="login-error-alert" id="waiter-login-error" role="alert" style="display: none;"></p>
        <button class="waiter-login-btn" id="waiter-login-submit" type="submit">دخول</button>
      </form>
    </section>

    <!-- Main Waiter POS Application -->
    <div class="waiter-app" id="waiter-app" style="display: none;">
      <!-- Header -->
      <!-- Pure Typographic Brand Header (Exact Match with Menu) -->
      <header class="waiter-header">
        <div class="header-container">
          <div class="header-brand-wrap">
            <a href="/waiter" class="brand-signature-lockup" aria-label="BOX COFE" dir="ltr">
              <span class="logo-word-box">BOX</span>
              <span class="logo-word-cofe">COFE</span>
            </a>
          </div>
        </div>
      </header>

      <!-- Toast Feedback Message -->
      <div class="waiter-toast" id="waiter-toast" role="status" aria-live="polite" style="display: none;"></div>

      <!-- Main Workspace: Catalog + Cart -->
      <main class="waiter-workspace">
        <!-- Catalog Section -->
        <section class="waiter-catalog" aria-label="منيو الأصناف">
          <div class="search-box-wrapper">
            <label for="waiter-search" class="sr-only">البحث في الأصناف</label>
            <span class="search-icon-pos" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </span>
            <input
              type="search"
              id="waiter-search"
              class="search-input"
              placeholder="ابحث عن صنف أو مشروب..."
              autocomplete="off"
            />
          </div>

          <nav class="categories-nav" aria-label="فئات المنيو">
            <ul class="categories-list" id="waiter-categories-list">
              <!-- Dynamically populated category pills -->
            </ul>
          </nav>

          <div id="waiter-products-container">
            <!-- Dynamically populated category sections & product cards -->
          </div>
        </section>

        <!-- Cart Panel / Sidebar -->
        <aside class="waiter-cart-panel" id="waiter-cart-panel" aria-label="سلة الطلب الحالي">
          <div class="waiter-cart-panel-inner">
            <div class="cart-header">
              <div class="cart-title-wrap">
                <h2>السلة</h2>
                <span class="cart-count-badge" id="cart-count-badge">0</span>
              </div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <button type="button" class="cart-clear-btn" id="cart-clear-btn" style="display: none;">تفريغ</button>
                <button type="button" class="waiter-signout-btn" id="waiter-signout-btn" title="تسجيل الخروج">خروج</button>
                <button type="button" class="cart-mobile-close-btn" id="cart-mobile-close-btn" aria-label="إغلاق السلة">✕</button>
              </div>
            </div>

            <!-- Order Mode: Car vs Walkin -->
            <div class="order-mode-toggle" role="radiogroup" aria-label="نوع الطلب">
              <button type="button" class="mode-btn active" id="mode-car-btn" data-mode="car" aria-checked="true" role="radio">
                <span>🚗</span>
                <span>سيارة</span>
              </button>
              <button type="button" class="mode-btn" id="mode-walkin-btn" data-mode="walkin" aria-checked="false" role="radio">
                <span>🚶‍♂️</span>
                <span>مشاة / صالة</span>
              </button>
            </div>

            <!-- Cart Items List -->
            <div class="cart-items-scroll" id="cart-items-container">
              <div class="cart-empty-view" id="cart-empty-view">
                <svg viewBox="0 0 24 24" fill="none"><path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8zM6 1v3M10 1v3M14 1v3" stroke-width="1.8"/></svg>
                <span>السلة فارغة</span>
              </div>
            </div>

            <!-- Order Context Inputs -->
            <div class="cart-inputs-area">
              <input
                type="text"
                id="order-vehicle-input"
                class="cart-input-field"
                maxlength="80"
                placeholder="وصف السيارة أو رقم اللوحة (مثال: لاندكروزر أبيض)"
              />
              <input
                type="text"
                id="order-walkin-input"
                class="cart-input-field"
                maxlength="80"
                placeholder="اسم الزبون أو رقم الطاولة (مثال: طاولة 4)"
                style="display: none;"
              />
              <input
                type="text"
                id="order-kitchen-note"
                class="cart-input-field"
                maxlength="150"
                placeholder="ملاحظة للمطبخ (اختياري)"
              />
            </div>

            <!-- Cart Footer -->
            <div class="cart-footer">
              <div class="cart-total-row">
                <span class="cart-total-label">المجموع</span>
                <span class="cart-total-amount" id="cart-total-amount">0 د.ع</span>
              </div>
              <button type="button" class="cart-submit-btn" id="cart-submit-btn" disabled>
                <span>إنشاء الطلب</span>
                <span aria-hidden="true">←</span>
              </button>
            </div>
          </div>
        </aside>
      </main>

      <!-- Mobile Fixed Bottom Cart Bar -->
      <div class="mobile-cart-bar" id="mobile-cart-bar">
        <div class="mobile-cart-summary">
          <span class="mobile-cart-items-count" id="mobile-cart-items-count">0 أصناف</span>
          <span class="mobile-cart-total-price" id="mobile-cart-total-price">0 د.ع</span>
        </div>
        <button type="button" class="mobile-cart-open-btn" id="mobile-cart-open-btn">
          <span>مراجعة الطلب</span>
          <span aria-hidden="true">←</span>
        </button>
      </div>
    </div>

    <!-- Product Customization Dialog (Only for items with options) -->
    <dialog class="customization-dialog" id="product-dialog" aria-labelledby="dialog-product-name">
      <div class="dialog-shell">
        <div class="dialog-header">
          <h3 id="dialog-product-name">اسم الصنف</h3>
          <button type="button" class="dialog-close-btn" id="dialog-close-btn" aria-label="إغلاق">✕</button>
        </div>
        <div class="dialog-body" id="dialog-options-container">
          <!-- Dynamically populated option groups -->
        </div>
        <p class="login-error-alert" id="dialog-option-error" style="display: none; margin: 0 18px 8px;"></p>
        <div class="dialog-footer">
          <div class="dialog-stepper">
            <button type="button" id="dialog-qty-minus" aria-label="تقليل الكمية">−</button>
            <span id="dialog-qty">1</span>
            <button type="button" id="dialog-qty-plus" aria-label="زيادة الكمية">+</button>
          </div>
          <button type="button" class="dialog-add-btn" id="dialog-add-btn">
            <span>إضافة إلى السلة · </span>
            <span id="dialog-total-price">0 د.ع</span>
          </button>
        </div>
      </div>
    </dialog>

    <!-- Order Created Success Dialog -->
    <dialog class="success-dialog" id="success-dialog" aria-labelledby="success-dialog-title">
      <div class="success-icon-circle" aria-hidden="true">✓</div>
      <h3 id="success-dialog-title">تم إنشاء الطلب بنجاح</h3>
      <div>رقم الطلب:</div>
      <div class="success-order-code" id="success-order-code">#—</div>
      <p class="success-total-hint" id="success-order-total">المجموع: 0 د.ع</p>
      <button type="button" class="success-new-order-btn" id="success-new-order-btn">طلب جديد</button>
    </dialog>

    <!-- Scripts -->
    <script src="/vendor/supabase.umd.js"></script>
    <script type="module" src="/js/waiter-app.js?v=20260927_waiter_v2"></script>
  </body>
</html>
